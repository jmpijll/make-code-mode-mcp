name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    name: typecheck + lint + test (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: ['20', '22']
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: 'npm'
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm test
      - run: npm run build

  cf-worker:
    name: cf-worker build smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
      - run: npm ci
      - run: npm run build
      # Confirm wrangler can parse the worker config; we don't deploy.
      # `worker_loaders` requires wrangler@4 — wrangler@3 prints a warning
      # but still succeeds at `deploy --dry-run`, which is what we want.
      - run: npx wrangler --version
      - run: npx wrangler deploy --dry-run --outdir=.wrangler-out --config cf-worker/wrangler.toml
